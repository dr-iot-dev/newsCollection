c/th\u003e\u003cth\u003eカナリークラウド AIコンバーター（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e）\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e機能の位置づけ\u003c/td\u003e\u003ctd\u003eポータルへ物件を一括入稿するコンバーター\u003c/td\u003e\u003ctd\u003eみらいえ内で販売図面を物件データへ登録するAI-OCR\u003c/td\u003e\u003ctd\u003e入稿・出稿の一元化とAI支援を組み合わせるコンバーター\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e物件情報の入力元\u003c/td\u003e\u003ctd\u003eマンション名・部屋番号から概要情報を入力（有償AI）\u003c/td\u003e\u003ctd\u003e販売図面PDF・JPEG・PNG\u003c/td\u003e\u003ctd\u003e業者間サイトの表示物件、図面・物件資料\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e入力結果の処理\u003c/td\u003e\u003ctd\u003e住所・沿線・築年月・専有面積・間取りなどを自動入力（有償AI）\u003c/td\u003e\u003ctd\u003e種別・種目や項目の意味を判別し、設備情報も登録項目へ振り分け\u003c/td\u003e\u003ctd\u003eサイトの表示物件を構造化、図面から各項目を入力\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e担当者の確認・修正\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e原本と結果を並列表示し、空欄を担当者が補完・修正\u003c/td\u003e\u003ctd\u003eAI入力は下書き保存し、掲載前に担当者が確認・修正\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e入力内容の自動チェック\u003c/td\u003e\u003ctd\u003e規約・ポータル入力ルール、必須項目・入力ミスをチェック（有償AI）\u003c/td\u003e\u003ctd\u003e資料で確認できず（AI-OCR単体の自動チェック機能）\u003c/td\u003e\u003ctd\u003e掲載前に入力ミス・抜け漏れを検知して通知\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eまとめて処理する対象\u003c/td\u003e\u003ctd\u003e複数ポータルへ一括入稿\u003c/td\u003e\u003ctd\u003e1図面の複数物件・区画を分けて登録。一度に最大5ファイル取込\u003c/td\u003e\u003ctd\u003e複数物件の掲載期限・掲載先をまとめて変更。複数店舗・本部への入稿集約に対応\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e画像・掲載文のAI支援\u003c/td\u003e\u003ctd\u003e写真選定・分類・加工、文字数制限に合わせたキャッチコピー提案（有償AI）\u003c/td\u003e\u003ctd\u003e資料で確認できず（AI-OCR単体の画像加工・掲載文生成）\u003c/td\u003e\u003ctd\u003e図面内写真のトリミング、写真分類、キャッチコメントの下書き\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e既存環境との連携\u003c/td\u003e\u003ctd\u003e既存Faciloシリーズ・コラビットのプロダクトと連携（新3製品共通の説明）\u003c/td\u003e\u003ctd\u003eみらいえ内に物件データを登録。基盤全体はポータル出稿・顧客管理などを支援\u003c/td\u003e\u003ctd\u003e接客マップ、カナリークラウドCRMの反響対応・追客、分析に物件データを活用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e導入・料金の条件\u003c/td\u003e\u003ctd\u003e自動入稿を支える基本機能は無料。AIは有償オプションで、具体額は資料で確認できず\u003c/td\u003e\u003ctd\u003eみらいえ契約企業向け。AI-OCRの料金詳細は問い合わせ\u003c/td\u003e\u003ctd\u003e資料で確認できず（料金額・課金条件）\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e各提供元の発表資料に基づく工程・機能の整理である。Faciloとカナリーはコンバーター、みらいえはプラットフォーム内のAI-OCRであり、比較範囲は物件情報の入力・登録と前後の工程である。「みらいえ」全体の掲載・顧客管理はAI-OCR単体の機能と区別した記載である。「資料で確認できず」は非対応を意味しない。\u003c/p\u003e\u003cp\u003eFaciloの写真・文章・入力支援など列挙されたAI機能は有償オプションであり、無料の基本機能に含まれると解釈できない。導入・料金の条件は資料発表時点の記載であり、2026年10月14日時点の契約価格確認ではない。各社を同じ条件で測定した読取精度や所要時間の比較ではない。\u003c/p\u003e\u003ch2\u003e比較の考察\u003c/h2\u003e\u003cp\u003e入力元の違いが、3対象を比較する出発点である。Faciloはマンション名や部屋番号から、住所・沿線・築年月などを自動入力すると説明している。みらいえ AI-OCRは販売図面のPDF・JPEG・PNGを取り込み、物件種別や項目の意味を判別して登録画面へ振り分けると発表元は説明する。カナリークラウド AIコンバーターは、業者間サイトの表示物件を構造化する入力に加え、図面・物件資料からの項目入力にも対応するとされる。入力負担の軽減という目的は共通でも、入力の起点は同じではない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e担当者による確認では、みらいえ AI-OCRは原本と読取結果を並列表示し、空欄を補完・修正できると説明される。カナリーはAI入力をまず下書きに保存し、掲載前に担当者が確認・修正できるとしている。みらいえは図面と結果を見比べて物件データに登録する工程、カナリーは下書きから掲載へ進む工程に確認が置かれている。確認の仕組みを、それによる精度向上を実測した結果と同一視しないことも必要である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e画像や掲載文の準備では、Faciloは物件写真の選定・分類・加工と、ポータルの文字数制限に合わせたキャッチコピー提案を説明している。入力ルールや必須項目、入力ミスをチェックするAI機能も記載がある。カナリーも写真分類とキャッチコメントの下書き、図面内写真のトリミング、掲載前の入力ミス検知を説明している。入力だけでなく、掲載する情報を整える支援まで含めるかが両コンバーターの比較軸になる。FaciloのこれらのAI機能は有償オプションである。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003eまとめて処理する対象にも違いがある。Faciloの説明は複数ポータルへの一括入稿である。みらいえ AI-OCRは1枚の図面に載る複数物件や土地区画を分けて登録でき、一度に最大5ファイルを取り込めると説明される。これは5物件という上限を意味しない。カナリーは複数物件の掲載期限・掲載先をまとめて変更し、複数店舗や本部への入稿集約にも対応するとしている。掲載先、入力ファイル、物件の掲載条件はそれぞれ別の処理単位である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e入力した物件データの行き先も確認したい。Faciloは既存のFaciloシリーズやコラビットのプロダクトとの連携を説明している。みらいえ AI-OCRは「みらいえ」内の物件データとして登録する機能であり、基盤全体にはポータル出稿や顧客管理などの説明もあるが、AI-OCR単体の機能とは区別する必要がある。カナリーは物件データを接客用マップやカナリークラウドCRMと連携した反響対応・追客、分析にも利用すると説明する。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e料金の条件では、Faciloの無料提供は各ポータルへの自動入稿を支える基本機能に限られ、資料に列挙されたAI機能は有償である。みらいえ AI-OCRは「みらいえ」契約企業向けの機能で、料金詳細は問い合わせとなる。カナリーについては今回の資料に料金情報がなく、同じ問い合わせ型の料金体系と推定することはできない。入力元、人の確認、掲載や顧客管理との連携、契約範囲をあわせて確認することが、比較から得られる選択の観点である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003ch2\u003e出典\u003c/h2\u003e\u003cul\u003e\u003cli\u003e資料1: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000046.000113384.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eFacilo、AI駆動の3プロダクトを新規リリース\u003c/a\u003e（発表日：2026-10-01）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料2: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000031.000022104.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e物件図面から簡単に登録。不動産関連情報の読み取り精度をとことん磨き上げた「不動産専用AI-OCR」をリリース\u003c/a\u003e（発表日：2026-09-29）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料3: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000053.000046040.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e不動産Vertical AI/SaaS「カナリークラウド」、物件入稿をAIが支援する「AIコンバーター」をリリース\u003c/a\u003e（発表日：2026-10-01）\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e使用したAIモデル\u003c/h2\u003e\u003cul\u003e\u003cli\u003e本文作成：DeepSeek-R1-14B-Q4_K:latest（Ollama、実体14.8B／Q6_K）\u003c/li\u003e\u003cli\u003e検証状態：原文照合と決定的検査を実施した比較用原稿である。別モデルによる独立AI検証は未実施である。\u003c/li\u003e\u003c/ul\u003e", "file": "comparison-article-c13-local-20261014.md", "checks": {"checks": {"category_nonempty": true, "title_length": true, "title_suffix": true, "paragraph_count": true, "valid_fact_ids": true, "all_three_sources_used": true, "no_unallowed_numbers": true, "no_polite_style": true, "no_80char_copy": true, "no_html_url_email": true, "no_internal_fact_ids_in_prose": true, "legacy_comparisons_empty": true, "three_unique_urls": true, "unknown_note_conditional": true, "shared_table_exact": true}, "passed": true, "title_chars": 30, "lead_chars": 151, "body_chars": 1278, "paragraph_count": 6, "prose_chars": 1466, "unique_fact_ids": 25, "unallowed_numbers": [], "source_matches": [{"f_id": "F065", "longest_continuous_match": 19}, {"f_id": "F438", "longest_continuous_match": 17}, {"f_id": "F637", "longest_continuous_match": 17}]}}}, "metrics": {"local": {"usage": {"prompt_tokens": 8183, "output_tokens": 1288}, "duration_seconds": 43.781, "server_metrics": {"total_duration": 43471957500, "load_duration": 16398300, "prompt_eval_duration": 5868000000, "eval_duration": 37585000000}}, "api": {"usage": {"input_tokens": 7193, "input_tokens_details": {"cache_write_tokens": 0, "cached_tokens": 0}, "output_tokens": 2086, "output_tokens_details": {"reasoning_tokens": 0}, "total_tokens": 9279}, "duration_seconds": 16.297, "writer_estimated_usd": 0.006214800000000001, "writer_and_verifier_estimated_usd": 0.0468528, "response_temperature": 1.0, "max_output_tokens": 7000}, "selfcheck": {"status": "invalid_response", "duration_seconds": 21.344, "prompt_tokens": 14218, "output_tokens": 242, "not_independent": true}}}, {"key": "C22", "label": "第3候補 C22 AIアバター面接", "variants": {"api_original": {"html": "\u003ch1\u003eAIアバター面接による一次選考支援の三サービス比較：対話機能と運用特性に注目\u003c/h1\u003e\u003cp\u003e企業の採用面接においてAIアバターが応募者と対話し、選考担当者の負担軽減や評価支援を図るサービスが増加している。パソナ提供の「Career Gate」、Preferred Networksの「タレスカAI面接」、JetBの「Our AI面接」は、それぞれ異なる特徴を持ちながら、応募者との面接対話や評価支援を実施する。本稿では各サービスの利用場面、対話内容の深掘り機能、面接後の情報提供および確認体制、受検環境や料金体系について整理し比較する。導入実績や評価精度の優劣を直接示すものではなく、提供情報に基づく機能と運用の違いに着目する。\u003c/p\u003e\u003ch2\u003e比較表\u003c/h2\u003e\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e項目\u003c/th\u003e\u003cth\u003eCareer Gate（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eタレスカAI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eOur AI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e）\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e提供元・資料の立場\u003c/td\u003e\u003ctd\u003eパソナのサービス。API採用の発表元はAVITA\u003c/td\u003e\u003ctd\u003ePreferred Networks（PFN）のサービス・導入事例\u003c/td\u003e\u003ctd\u003eJetBのサービス・問い合わせ動向の発表\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接を使う場面\u003c/td\u003e\u003ctd\u003e応募者が多い企業の一次面接・初期選考を支援\u003c/td\u003e\u003ctd\u003e求職者の適性評価支援。資料は2028年卒夏インターンシップ選考の導入・検証事例\u003c/td\u003e\u003ctd\u003e企業の設定質問による面接。採用代行の一次面接や経歴・希望条件の聞き取りも想定（実績とは区別）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAIとの対話\u003c/td\u003e\u003ctd\u003eAVITA AVATAR APIを使うAIアバター面接官\u003c/td\u003e\u003ctd\u003eAIアバターとの面接\u003c/td\u003e\u003ctd\u003eAIアバターが企業設定の質問に沿って対話\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003ctd\u003e回答に応じた深掘り質問\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接後の情報\u003c/td\u003e\u003ctd\u003e回答内容の要約・スコアリング\u003c/td\u003e\u003ctd\u003e本事例では4指標のAI評価と面接録画データの確認\u003c/td\u003e\u003ctd\u003e面接動画・文字起こし・レポート。設定評価軸に基づく分析結果・評価根拠を提示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人の確認・判断との関係\u003c/td\u003e\u003ctd\u003e資料で確認できず（最終判断の担当・具体的な確認手順）\u003c/td\u003e\u003ctd\u003e本事例では担当者が録画を確認し、後段のグループディスカッションで人が独立評価\u003c/td\u003e\u003ctd\u003e担当者が記録を確認し、採否の最終判断は人が実施\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e受検時間・環境の記載\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e本選考では24時間・場所を問わず受検可能\u003c/td\u003e\u003ctd\u003e24時間365日、PC・スマートフォン・タブレット。アプリ・受検者アカウント登録不要\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e各提供元の発表資料に基づく機能と運用工程の整理である。Career Gateの提供元はパソナであり、資料1は基盤APIの採用をAVITAが発表したものである。タレスカの受検・評価・録画確認の記載は、沖縄セルラーの2028年卒夏インターンシップ選考という事例の条件を保った整理である。「資料で確認できず」は非対応を意味しない。\u003c/p\u003e\u003cp\u003e同一条件で3サービスを実測した精度や公平性の比較ではない。導入事例の検証結果や問い合わせ件数から、他社より高い精度や採用効果を判断することはできない。仕様・課金方式は発表時点の記載であり、2026年10月14日時点の契約価格確認ではない。\u003c/p\u003e\u003ch2\u003e比較の考察\u003c/h2\u003e\u003cp\u003eまず、パソナが提供する「Career Gate」は、応募者多数の企業に対する一次面接支援を目的とする。AIアバター面接官が採用活動の初期選考の負荷を軽減し、候補者の回答に応じて深掘り質問を重ねる対話が特徴である。面接内容の要約とスコアリングも行い、企業の採用効率化を支援している。なお、AIアバターの表示にはAVITAの「AVITA AVATAR API」が使われているが、API全体の細かな仕様やプライバシー要件はCareer Gateのサービス仕様に直結しない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e\u003c/p\u003e\u003cp\u003e次に、Preferred Networksの「タレスカAI面接」は、AIアバターとの面接により求職者の適性を多面的に評価する支援ツールである。具体的には潜在能力、コミュニケーション能力、問題解決能力、ビジネス理解力などを想定評価対象としている。沖縄セルラーの2028年卒夏インターンシップ選考での導入事例が示されており、170名が参加した同選考ではAIが4指標で評価し、面接録画は採用担当者が確認した上で最終判断に繋げている。こうした運用は初年度かつ単一企業のケースに限定されており、業界全体での必須工程や効果とは異なる点に留意が必要である。受検は24時間・場所を問わず可能で、多様な応募者に受検機会の公平性を提供したと説明されている。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e\u003c/p\u003e\u003cp\u003eまた、JetBが展開する「Our AI面接」は、企業側が用意した質問と評価項目設定に基づき、AIアバターが応募者と対話する仕組みである。回答内容に沿い追加質問を行うほか、面接終了後には動画と文字起こし、加えて分析結果や評価根拠の詳細なレポートを提供する。採用担当者はこれらを都合のよい時間に確認でき、日程調整や面接同席の必要がなく工数削減につながるとされる。最終的な採否判断は人が行う運用形態である。受検は24時間365日可能で、PCやスマートフォン、タブレットから利用でき、アプリのインストールや受検者アカウント登録も不要である。料金は面接数に依らず月額固定で従量課金はないが、具体的な金額は公開されていない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e以上三者を利用場面で比較すると、Career Gateが応募者多数の企業における一次面接の深掘り質問やスコアリング支援に特化しているのに対し、タレスカAI面接は求職者の多面的適性評価を目標とし、特定導入事例に基づいた運用例が示されている。Our AI面接は企業ごとの質問設計を活かしつつ、動画とレポートでの評価情報提供に重点が置かれている。どのサービスもAIが面接を実施するが、採否の最終判断には人が関わる点で共通している。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e受検環境では、タレスカAI面接が実証事例として24時間場所を問わずの利用を確認できる一方、Our AI面接は登録やアプリ不要で24時間365日対応可能と説明し、利用の柔軟性を打ち出している。Career Gateの受検条件や時間対応についての詳細は資料に明記がないため判断を保留する。費用面ではOur AI面接のみ具体的な価格体系が示されており、面接数にかかわらず月額固定料金制で従量課金無しであると説明されている。Career GateとタレスカAI面接の料金構造は公式情報に掲載がない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003eこれら三つのAIアバター面接サービスは、いずれも応募者との対話から得られる情報を選考担当者に提供し採用業務を効率化することを狙いとしているが、サービスの機能詳細や運用事例、対応時間帯、費用体系には差異がある。導入検討時には、利用シーンや求める評価軸、面接担当者の運用負担軽減ニーズなどを踏まえ、各サービスの公開情報を精査し適合度を判断することが望ましい。導入効果や評価の公平性、選考成功率を断定する比較資料は存在しないため、評価の参考は機能と提供実例の説明にとどめるべきである。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003ch2\u003e出典\u003c/h2\u003e\u003cul\u003e\u003cli\u003e資料1: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eパソナのAI面接サービス「Career Gate」にAVITAのAPIが採用\u003c/a\u003e（発表日：2026-09-11）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料2: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePreferred Networksの「タレスカAI面接」が沖縄セルラー電話のインターンシップ選考において「書類では見えないポテンシャル」の可視化を確認\u003c/a\u003e（発表日：2026-09-15）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料3: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e人手不足の採用現場をAIで支援。AIアバターが応募者と面接するサービスの人材会社からの問い合わせが前年同期比約2.7倍に\u003c/a\u003e（発表日：2026-09-29）\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e使用したAIモデル\u003c/h2\u003e\u003cul\u003e\u003cli\u003e本文作成：gpt-4.1-mini-2025-04-14（OpenAI API）\u003c/li\u003e\u003cli\u003e検証状態：比較用の生成直後・未修正原稿である。既存記事の独立検証は編集後の原稿に対して実施された。\u003c/li\u003e\u003c/ul\u003e", "file": "comparison-article-c22-api-original-20261014.md", "checks": {"checks": {"category_nonempty": true, "title_length": true, "title_suffix": true, "paragraph_count": true, "valid_fact_ids": true, "all_three_sources_used": true, "no_unallowed_numbers": true, "no_polite_style": true, "no_80char_copy": true, "no_html_url_email": true, "no_internal_fact_ids_in_prose": true, "legacy_comparisons_empty": true, "three_unique_urls": true, "unknown_note_conditional": true, "shared_table_exact": true}, "passed": true, "title_chars": 38, "lead_chars": 268, "body_chars": 1553, "paragraph_count": 6, "prose_chars": 1866, "unique_fact_ids": 24, "unallowed_numbers": [], "source_matches": [{"f_id": "F673", "longest_continuous_match": 19}, {"f_id": "F831", "longest_continuous_match": 34}, {"f_id": "F903", "longest_continuous_match": 16}]}}, "local_original": {"html": "\u003ch1\u003eCareer Gate、タレスカAI面接、Our AI面接を比較\u003c/h1\u003e\u003cp\u003e採用面接におけるAIアバターの活用が進む中、Career Gate、タレスカAI面接、Our AI面接はそれぞれ異なる特徴と機能を備えています。本記事では、3つのサービスの製品説明と比較を通じて、企業が採用選考に最適なツールを選ぶための参考情報を提供します。\u003c/p\u003e\u003ch2\u003e比較表\u003c/h2\u003e\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e項目\u003c/th\u003e\u003cth\u003eCareer Gate（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eタレスカAI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eOur AI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e）\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e提供元・資料の立場\u003c/td\u003e\u003ctd\u003eパソナのサービス。API採用の発表元はAVITA\u003c/td\u003e\u003ctd\u003ePreferred Networks（PFN）のサービス・導入事例\u003c/td\u003e\u003ctd\u003eJetBのサービス・問い合わせ動向の発表\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接を使う場面\u003c/td\u003e\u003ctd\u003e応募者が多い企業の一次面接・初期選考を支援\u003c/td\u003e\u003ctd\u003e求職者の適性評価支援。資料は2028年卒夏インターンシップ選考の導入・検証事例\u003c/td\u003e\u003ctd\u003e企業の設定質問による面接。採用代行の一次面接や経歴・希望条件の聞き取りも想定（実績とは区別）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAIとの対話\u003c/td\u003e\u003ctd\u003eAVITA AVATAR APIを使うAIアバター面接官\u003c/td\u003e\u003ctd\u003eAIアバターとの面接\u003c/td\u003e\u003ctd\u003eAIアバターが企業設定の質問に沿って対話\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003ctd\u003e回答に応じた深掘り質問\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接後の情報\u003c/td\u003e\u003ctd\u003e回答内容の要約・スコアリング\u003c/td\u003e\u003ctd\u003e本事例では4指標のAI評価と面接録画データの確認\u003c/td\u003e\u003ctd\u003e面接動画・文字起こし・レポート。設定評価軸に基づく分析結果・評価根拠を提示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人の確認・判断との関係\u003c/td\u003e\u003ctd\u003e資料で確認できず（最終判断の担当・具体的な確認手順）\u003c/td\u003e\u003ctd\u003e本事例では担当者が録画を確認し、後段のグループディスカッションで人が独立評価\u003c/td\u003e\u003ctd\u003e担当者が記録を確認し、採否の最終判断は人が実施\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e受検時間・環境の記載\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e本選考では24時間・場所を問わず受検可能\u003c/td\u003e\u003ctd\u003e24時間365日、PC・スマートフォン・タブレット。アプリ・受検者アカウント登録不要\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e各提供元の発表資料に基づく機能と運用工程の整理である。Career Gateの提供元はパソナであり、資料1は基盤APIの採用をAVITAが発表したものである。タレスカの受検・評価・録画確認の記載は、沖縄セルラーの2028年卒夏インターンシップ選考という事例の条件を保った整理である。「資料で確認できず」は非対応を意味しない。\u003c/p\u003e\u003cp\u003e同一条件で3サービスを実測した精度や公平性の比較ではない。導入事例の検証結果や問い合わせ件数から、他社より高い精度や採用効果を判断することはできない。仕様・課金方式は発表時点の記載であり、2026年10月14日時点の契約価格確認ではない。\u003c/p\u003e\u003ch2\u003e比較の考察\u003c/h2\u003e\u003cp\u003eパソナが提供する「Career Gate」は、応募者が多い企業の一次面接を支援するAIアバター面接サービスです。回答内容に基づき深掘り質問を行うことで、候補者の適性や能力を評価します。また、AVITAの「AVITA AVATAR API」が基盤として採用されています。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e\u003c/p\u003e\u003cp\u003ePreferred Networksが開発した「タレスカAI面接」は、AIアバターとの面接を通じて求職者の適性を評価します。潜在能力やコミュニケーション能力など4つの指標に基づき採用担当者が最終判断を行います。沖縄セルラーのインターンシップ選考において導入され、受検率92.4%を達成しました。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e\u003c/p\u003e\u003cp\u003eJetBが提供する「Our AI面接」は、企業が設定した質問に沿ってAIアバターが応募者と対話します。回答内容に基づき追加の質問を行い、分析結果や評価根拠をレポート形式で提示します。採否の最終判断は人間が行います。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」は、回答内容に基づき深掘り質問を行うことで候補者の適性を評価します。一方、「タレスカAI面接」は4つの指標に基づいて採用担当者が最終判断を行います。対して、「Our AI面接」は企業が設定した質問に沿って追加質問を行い、分析結果と根拠をレポートで提示します。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」はパソナが提供し、「タレスカAI面接」はPreferred Networksが提供しています。一方、「Our AI面接」はJetBが提供するサービスです。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」は一次面接支援を主な役割とし、「タレスカAI面接」は適性評価に特化しています。一方、「Our AI面接」は企業が質問を設定し、回答内容に基づき追加の質問を行う柔軟さを備えています。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」は回答内容の要約とスコアリングを行います。一方、「タレスカAI面接」は4指標での評価を採用担当者が確認し、最終判断を行います。対して、「Our AI面接」は設定した評価軸に基づき分析結果と根拠をレポートで提示します。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」は24時間受検が可能です。一方、「タレスカAI面接」も同様に24時間受検が可能です。一方、「Our AI面接」はPC、スマートフォン、タブレットから24時間365日受検可能で、アプリや受検者アカウント登録不要です。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e「Career Gate」の料金は未記載ですが、「タレスカAI面接」も具体的な料金は発表されていません。一方、「Our AI面接」は面接実施数によらず月額固定で従量課金はありません。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003ch2\u003e出典\u003c/h2\u003e\u003cul\u003e\u003cli\u003e資料1: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eパソナのAI面接サービス「Career Gate」にAVITAのAPIが採用\u003c/a\u003e（発表日：2026-09-11）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料2: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePreferred Networksの「タレスカAI面接」が沖縄セルラー電話のインターンシップ選考において「書類では見えないポテンシャル」の可視化を確認\u003c/a\u003e（発表日：2026-09-15）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料3: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e人手不足の採用現場をAIで支援。AIアバターが応募者と面接するサービスの人材会社からの問い合わせが前年同期比約2.7倍に\u003c/a\u003e（発表日：2026-09-29）\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e使用したAIモデル\u003c/h2\u003e\u003cul\u003e\u003cli\u003e本文作成：DeepSeek-R1-14B-Q4_K:latest（Ollama、実体14.8B／Q6_K）\u003c/li\u003e\u003cli\u003e検証状態：比較用の生成直後・未修正原稿である。\u003c/li\u003e\u003c/ul\u003e", "file": "comparison-article-c22-local-original-20261014.md", "checks": {"checks": {"category_nonempty": false, "title_length": true, "title_suffix": false, "paragraph_count": true, "valid_fact_ids": true, "all_three_sources_used": true, "no_unallowed_numbers": true, "no_polite_style": false, "no_80char_copy": true, "no_html_url_email": true, "no_internal_fact_ids_in_prose": true, "legacy_comparisons_empty": true, "three_unique_urls": true, "unknown_note_conditional": true, "shared_table_exact": true}, "passed": false, "title_chars": 32, "lead_chars": 129, "body_chars": 1055, "paragraph_count": 9, "prose_chars": 1226, "unique_fact_ids": 18, "unallowed_numbers": [], "source_matches": [{"f_id": "F673", "longest_continuous_match": 19}, {"f_id": "F831", "longest_continuous_match": 22}, {"f_id": "F903", "longest_continuous_match": 39}]}}, "api_edited": {"html": "\u003ch1\u003eAIアバター面接3サービスの対話機能と選考担当者が確認する情報\u003c/h1\u003e\u003cp\u003eAIアバターによる面接では、応募者との対話だけでなく、面接後にどの情報を人が確認するかが比較の観点になる。パソナのCareer Gate、Preferred NetworksのタレスカAI面接、JetBのOur AI面接の発表資料から、追加質問、評価情報、確認工程と受検条件を整理する。タレスカの記載は、1社・初年度の選考事例という条件を保って読む必要がある。\u003c/p\u003e\u003ch2\u003e比較表\u003c/h2\u003e\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e項目\u003c/th\u003e\u003cth\u003eCareer Gate（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eタレスカAI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e）\u003c/th\u003e\u003cth\u003eOur AI面接（\u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e）\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e提供元・資料の立場\u003c/td\u003e\u003ctd\u003eパソナのサービス。API採用の発表元はAVITA\u003c/td\u003e\u003ctd\u003ePreferred Networks（PFN）のサービス・導入事例\u003c/td\u003e\u003ctd\u003eJetBのサービス・問い合わせ動向の発表\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接を使う場面\u003c/td\u003e\u003ctd\u003e応募者が多い企業の一次面接・初期選考を支援\u003c/td\u003e\u003ctd\u003e求職者の適性評価支援。資料は2028年卒夏インターンシップ選考の導入・検証事例\u003c/td\u003e\u003ctd\u003e企業の設定質問による面接。採用代行の一次面接や経歴・希望条件の聞き取りも想定（実績とは区別）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAIとの対話\u003c/td\u003e\u003ctd\u003eAVITA AVATAR APIを使うAIアバター面接官\u003c/td\u003e\u003ctd\u003eAIアバターとの面接\u003c/td\u003e\u003ctd\u003eAIアバターが企業設定の質問に沿って対話\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003ctd\u003e回答に応じた深掘り質問\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接後の情報\u003c/td\u003e\u003ctd\u003e回答内容の要約・スコアリング\u003c/td\u003e\u003ctd\u003e本事例では4指標のAI評価と面接録画データの確認\u003c/td\u003e\u003ctd\u003e面接動画・文字起こし・レポート。設定評価軸に基づく分析結果・評価根拠を提示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人の確認・判断との関係\u003c/td\u003e\u003ctd\u003e資料で確認できず（最終判断の担当・具体的な確認手順）\u003c/td\u003e\u003ctd\u003e本事例では担当者が録画を確認し、後段のグループディスカッションで人が独立評価\u003c/td\u003e\u003ctd\u003e担当者が記録を確認し、採否の最終判断は人が実施\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e受検時間・環境の記載\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e本選考では24時間・場所を問わず受検可能\u003c/td\u003e\u003ctd\u003e24時間365日、PC・スマートフォン・タブレット。アプリ・受検者アカウント登録不要\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e各提供元の発表資料に基づく機能と運用工程の整理である。Career Gateの提供元はパソナであり、資料1は基盤APIの採用をAVITAが発表したものである。タレスカの受検・評価・録画確認の記載は、沖縄セルラーの2028年卒夏インターンシップ選考という事例の条件を保った整理である。「資料で確認できず」は非対応を意味しない。\u003c/p\u003e\u003cp\u003e同一条件で3サービスを実測した精度や公平性の比較ではない。導入事例の検証結果や問い合わせ件数から、他社より高い精度や採用効果を判断することはできない。仕様・課金方式は発表時点の記載であり、2026年10月14日時点の契約価格確認ではない。\u003c/p\u003e\u003ch2\u003e比較の考察\u003c/h2\u003e\u003cp\u003e3サービスで共通するのは、AIアバターが応募者との面接対話を支援する設計である。AVITAの発表によると、Career Gateはパソナが提供し、応募者が多い企業の一次面接や初期選考を支援する。AVITA AVATAR APIは面接官の表示に利用される基盤である。Preferred Networksは、タレスカAI面接をAIアバターとの対話による求職者の適性評価支援と説明している。Our AI面接についてJetBは、企業が設定した質問・評価項目に基づいて対話から結果の確認までを進めるサービスと説明する。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e回答に応じて質問を掘り下げる点では、Career GateとOur AI面接に共通の記載がある。Career Gateは候補者の回答に応じた深掘り質問に対応するとAVITAが説明し、Our AI面接も回答内容に応じた追加質問を行うとJetBは説明している。Our AI面接では企業が質問と評価項目を設定するため、面接の質問設計と評価結果の確認を同じ流れで捉えられる。タレスカの今回の資料は、適性評価の対象や導入事例を説明しているが、追加質問の具体的な仕組みまでは確認できない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e面接後に残る情報の種類も異なる。Career Gateは回答の要約とスコアリングに対応すると説明される。Our AI面接では、動画・文字起こし・レポートを担当者が確認でき、設定した評価軸に基づく分析結果と評価根拠をレポートで示すとJetBは説明する。タレスカの資料では、沖縄セルラーの2028年卒夏インターンシップ選考で4指標によるAI評価と録画確認を行ったことが記載されている。要約やスコア、発言を確認する記録、評価根拠の提示を区別し、必要な確認作業に合う情報を読むことが比較の軸である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e人が確認する工程については、事例の運用と一般の機能説明を分ける必要がある。タレスカの導入事例では採用担当者が面接録画を確認し、後段のグループディスカッションでは人の面接官が独立して評価している。提供元は1社・初年度の検証と位置づけており、すべての導入先に同じ手順や効果があるとは言えない。Our AI面接では担当者が記録を都合のよい時間に確認し、採否の最終判断は人が行うと明記される。Career Gateは一次面接の支援が説明される一方、最終判断の担当や具体的な確認手順は今回の資料から特定できない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e受検の時間と環境では、タレスカの事例は24時間・場所を問わず受検できる仕組みを利用したと説明されている。Our AI面接は24時間365日、PC・スマートフォン・タブレットから受検でき、アプリのインストールや受検者のアカウント登録は不要とJetBは説明する。Career Gateの対応時間や受検端末については、今回の資料に比較できる記載がない。こうした受検条件と、担当者がいつ記録を確認するかは別の工程であり、面接の進め方を考える際にも区別して確認したい。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e費用について、Our AI面接の資料は面接実施数によらない月額固定で、従量課金がないと説明している。ただし、金額は示されておらず、今回の他の2資料にも料金を比較するための記載はないため、総費用や最安の判断はできない。機能面では、対話の深掘り、面接後に残る情報、人が確認する工程、受検条件を順に見ると、3サービスの説明の違いを整理できる。導入事例の成果や問い合わせの増加を、他社より高い評価精度や公平性の証拠と読み替えず、発表資料で確認できる機能と運用範囲に沿って検討するのが妥当である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\ に応じた深掘り質問\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e回答に応じた追加質問\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面接後の情報\u003c/td\u003e\u003ctd\u003e回答内容の要約・スコアリング\u003c/td\u003e\u003ctd\u003e本事例では4指標のAI評価と面接録画データの確認\u003c/td\u003e\u003ctd\u003e面接動画・文字起こし・レポート。設定評価軸に基づく分析結果・評価根拠を提示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人の確認・判断との関係\u003c/td\u003e\u003ctd\u003e資料で確認できず（最終判断の担当・具体的な確認手順）\u003c/td\u003e\u003ctd\u003e本事例では担当者が録画を確認し、後段のグループディスカッションで人が独立評価\u003c/td\u003e\u003ctd\u003e担当者が記録を確認し、採否の最終判断は人が実施\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e受検時間・環境の記載\u003c/td\u003e\u003ctd\u003e資料で確認できず\u003c/td\u003e\u003ctd\u003e本選考では24時間・場所を問わず受検可能\u003c/td\u003e\u003ctd\u003e24時間365日、PC・スマートフォン・タブレット。アプリ・受検者アカウント登録不要\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e各提供元の発表資料に基づく機能と運用工程の整理である。Career Gateの提供元はパソナであり、資料1は基盤APIの採用をAVITAが発表したものである。タレスカの受検・評価・録画確認の記載は、沖縄セルラーの2028年卒夏インターンシップ選考という事例の条件を保った整理である。「資料で確認できず」は非対応を意味しない。\u003c/p\u003e\u003cp\u003e同一条件で3サービスを実測した精度や公平性の比較ではない。導入事例の検証結果や問い合わせ件数から、他社より高い精度や採用効果を判断することはできない。仕様・課金方式は発表時点の記載であり、2026年10月14日時点の契約価格確認ではない。\u003c/p\u003e\u003ch2\u003e比較の考察\u003c/h2\u003e\u003cp\u003eパソナが提供するCareer Gateは、応募者が多い企業の一次面接をAIアバターが支援するとAVITAの資料で説明される。AVITA AVATAR APIはアバター面接官の表示に採用された基盤である。Preferred Networksは、タレスカAI面接をAIアバターとの面接による求職者の適性評価支援と説明している。JetBのOur AI面接は、企業が設定した質問・評価項目に沿って対話と結果確認を行うとされる。共通するのはAIとの面接対話であり、評価の内容が全て同じとは言えない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e回答に応じた追加質問は、Career GateとOur AI面接で説明されている。Career Gateは候補者の回答を深掘りし、Our AI面接も回答内容に応じ追加質問を行うとされる。タレスカの資料は潜在能力・コミュニケーション能力などを評価対象として挙げているが、これらの例を、そのまま事例で用いた4指標の正式名称と読み替えることはできない。追加質問の具体的な仕組みも今回の資料からは特定できない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e面接後の情報は、Career Gateが回答の要約とスコアリングに対応すると説明されるのに対し、Our AI面接は動画・文字起こし・レポートを提示すると説明される。Ourのレポートには企業が設定した評価軸に基づく分析結果と評価根拠が含まれる。タレスカの資料では、沖縄セルラーの2028年卒夏インターンシップ選考で4指標のAI評価を行い、担当者が面接録画を確認したと記載される。記録形式と評価結果を区別し、担当者が確認したい情報を比較することが重要である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e人が判断する工程では、Our AI面接は採否の最終判断を人が行うと明記している。タレスカの事例では、録画を担当者が確認した後、グループディスカッションで人の面接官が独立した評価を行っている。提供元は1社・初年度の検証と位置づけており、全ての利用企業に同じ手順を一般化することはできない。Career Gateの具体的な確認手順や最終判断の担当は、今回の資料から特定できない。3サービス全てが人の最終判断を明記しているとまとめることはできない。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003e受検環境について、タレスカの選考事例は24時間・場所を問わず受検できる仕組みを説明している。Our AI面接は24時間365日、PC・スマートフォン・タブレットから受検でき、アプリのインストールや受検者のアカウント登録は不要とJetBは説明する。Career Gateの対応時間は今回の資料に記載がないため、他のサービスと同じ24時間対応とは推定できない。受検できる時間と、人が記録を確認する工程は別の条件として読む必要がある。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003cp\u003eOur AI面接の資料では、面接実施数によらない月額固定で従量課金がないと説明される。ただし具体額は示されず、Career Gateとタレスカの今回の資料にも料金を比較するための情報はない。問い合わせ増加や1社の導入事例を、他社より高い評価精度や公平性の根拠として扱うこともできない。対話の深掘り、記録と評価根拠、人の確認工程、受検環境を、資料で確認できる範囲に沿って整理するのが妥当である。 \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料1\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料2\u003c/a\u003e \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e資料3\u003c/a\u003e\u003c/p\u003e\u003ch2\u003e出典\u003c/h2\u003e\u003cul\u003e\u003cli\u003e資料1: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000111.000085375.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eパソナのAI面接サービス「Career Gate」にAVITAのAPIが採用\u003c/a\u003e（発表日：2026-09-11）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料2: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000033.000156310.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePreferred Networksの「タレスカAI面接」が沖縄セルラー電話のインターンシップ選考において「書類では見えないポテンシャル」の可視化を確認\u003c/a\u003e（発表日：2026-09-15）\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e資料3: \u003ca href=\"https://prtimes.jp/main/html/rd/p/000000113.000010333.html\" t
