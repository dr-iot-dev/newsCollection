<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>記事群F：記事ペアの距離</title><style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#182e42;background:#f4f6f8;font-size:14px}*{box-sizing:border-box}
body{margin:0;padding:20px}main{max-width:1200px;margin:auto}h1{font-size:21px;margin:0 0 8px}.meta{color:#526577;margin-bottom:16px;font-size:13px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}input{flex:1;min-width:220px;padding:9px 12px;border:1px solid #b6c4cf;border-radius:6px}button,select{padding:7px 10px;border:1px solid #b6c4cf;border-radius:5px;background:white;cursor:pointer}button:disabled{opacity:.35;cursor:default}
a{color:#145ea0}nav{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.info{margin-left:auto;color:#526577;font-size:12px}
.sheet{background:white;border:1px solid #d8e1e8;border-radius:7px;overflow:auto;max-height:73vh}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:580px}th{position:sticky;top:0;background:#e8eef4;text-align:left;font-size:12px;color:#42586b;z-index:1}td,th{padding:9px 8px;border-bottom:1px solid #e7edf2}tr:hover td{background:#f4f9ff}.rank{width:50px;color:#687c8d;font-variant-numeric:tabular-nums}.distance{width:96px;font-variant-numeric:tabular-nums;text-align:right}.article{width:calc((100% - 146px)/2)}.article button{display:flex;align-items:center;gap:7px;width:100%;padding:0;border:0;background:none;text-align:left}.fid{font-size:11px;color:#526a7d;background:#edf2f6;border-radius:3px;padding:2px 4px;flex:none}.title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:#164f7c;font-size:13px}.hint{font-size:12px;color:#526577;margin:10px 0}.links{display:flex;gap:15px;font-size:12px;flex-wrap:wrap}
dialog{border:1px solid #bacbd8;border-radius:10px;max-width:680px;width:90%;padding:22px;box-shadow:0 12px 50px #162c4244}dialog::backdrop{background:#12263855}dialog h2{font-size:17px;line-height:1.65;overflow-wrap:anywhere}dialog p{line-height:1.6;font-size:13px}dialog .close{float:right}#empty{text-align:center;padding:30px;color:#526577}footer{font-size:11px;color:#6d7b88;margin-top:14px}@media(max-width:650px){body{padding:10px}h1{font-size:18px}.sheet{max-height:70vh}.info{margin-left:0}}
</style></head><body><main>
<h1>記事群F：記事ペアの距離</h1><div class="meta" id="meta"></div>
<div class="tools"><input id="query" type="search" placeholder="タイトル・記事ID・分野で絞り込み" aria-label="記事を検索"><label>表示 <select id="size"><option>25</option><option selected>50</option><option>100</option></select> 件</label></div>
<nav><button id="first">先頭</button><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button><button id="last">末尾</button><span id="range" class="info"></span></nav>
<div class="sheet"><table><thead><tr><th class="rank">順位</th><th class="distance">距離 ↑</th><th class="article">記事A</th><th class="article">記事B</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>該当するペアがありません</div></div>
<p class="hint">距離が小さいほど内容が近いペアです。タイトルにマウスを置くと全文を表示し、クリックすると全文・記事リンク・候補数を確認できます。</p>
<div class="links"><a href="pair-distances.csv" download>全ペアのCSV</a><a href="article-values.json" download>各記事のベクトル値</a><a href="group-F.json" download>記事群F一覧</a><a href="summary.json" download>計算条件</a></div>
<footer id="footer"></footer><dialog id="detail"><button class="close" id="close">閉じる</button><p id="article-id"></p><h2 id="article-title"></h2><p id="article-info"></p><a id="article-link" target="_blank" rel="noopener noreferrer">元の記事を開く</a></dialog>
<script type="application/json" id="data">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),byId=Object.fromEntries(data.articles.map(a=>[a.f_id,a]));
const $=id=>document.getElementById(id);let page=0,filtered=data.pairs.map((p,i)=>({p,rank:i+1}));
$('meta').textContent=`E ${data.summary.E_count}件 → F ${data.summary.F_count}件（一致候補数5以上） · 全${data.summary.pair_count.toLocaleString()}ペア · 距離の小さい順`;
$('footer').textContent=`${data.summary.model} / ${data.summary.dimensions}次元 / 距離 = 1 − コサイン類似度。自己ペアと逆順重複は含みません。`;
function showArticle(a){$('article-id').textContent=a.f_id;$('article-title').textContent=a.title;$('article-info').textContent=`分野：${a.domains.join('・')} ／ 一致候補数：${a.concept_count} ／ ベクトル：${a.dimensions}次元`;$('article-link').href=/^https?:\/\//.test(a.url)?a.url:'#';$('detail').showModal();}
function articleCell(id){const a=byId[id],td=document.createElement('td'),button=document.createElement('button'),tag=document.createElement('span'),title=document.createElement('span');td.className='article';tag.className='fid';tag.textContent=id;title.className='title';title.textContent=a.title;button.title=a.title;button.setAttribute('aria-label',`${id} ${a.title}`);button.append(tag,title);button.onclick=()=>showArticle(a);td.append(button);return td;}
function render(){const size=Number($('size').value),pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.max(0,Math.min(page,pages-1));$('rows').replaceChildren();for(const {p,rank} of filtered.slice(page*size,(page+1)*size)){const tr=document.createElement('tr'),r=document.createElement('td'),d=document.createElement('td');r.className='rank';r.textContent=rank;d.className='distance';d.textContent=p[2].toFixed(6);d.title=String(p[2]);tr.append(r,d,articleCell(p[0]),articleCell(p[1]));$('rows').append(tr);}$('empty').hidden=filtered.length!==0;$('page').textContent=`${page+1} / ${pages}`;$('range').textContent=filtered.length?`${page*size+1}–${Math.min((page+1)*size,filtered.length)} / ${filtered.length.toLocaleString()}件`: '0件';$('first').disabled=$('prev').disabled=page===0;$('last').disabled=$('next').disabled=page===pages-1;}
$('query').oninput=()=>{const q=$('query').value.normalize('NFKC').toLowerCase().trim();filtered=data.pairs.map((p,i)=>({p,rank:i+1})).filter(({p})=>[p[0],p[1]].some(id=>{const a=byId[id];return `${id} ${a.title} ${a.domains.join(' ')}`.normalize('NFKC').toLowerCase().includes(q);}));page=0;render();};
$('size').onchange=()=>{page=0;render();};$('first').onclick=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('last').onclick=()=>{page=Math.ceil(filtered.length/Number($('size').value))-1;render();};$('close').onclick=()=>$('detail').close();render();
</script></main></body></html>
