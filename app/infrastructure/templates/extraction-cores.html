<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記事群F · 高密度コア</title>
<style>
:root{font:14px/1.6 system-ui,sans-serif;color:#172b40;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 8px}.muted{color:#596b7d;font-size:13px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stats div{background:white;border:1px solid #dce4ec;border-radius:8px;padding:10px 18px}.stats b{font-size:23px;margin-right:6px}.card{background:white;border:1px solid #dce4ec;border-radius:8px;padding:14px;overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e4eaf1;text-align:left;vertical-align:middle}th{color:#526477;background:#f8fafc;font-weight:600}tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.id{font:12px ui-monospace,monospace}.article{width:auto}.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title button{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;color:#126584;cursor:pointer;font:inherit}.core-label{color:#10735c;font-weight:600}.noise{color:#7a8794}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}input,select,button{font:inherit;border:1px solid #ced8e2;border-radius:5px;padding:6px 9px;background:white}input{flex:1;min-width:150px}button{cursor:pointer}a{color:#126584}details{margin-top:14px}summary{cursor:pointer}dialog{border:1px solid #ced8e2;border-radius:10px;max-width:650px;width:calc(100% - 32px);padding:22px;box-shadow:0 12px 60px #172b4033}dialog::backdrop{background:#172b4066}dialog h2{margin-top:0;line-height:1.6}dialog p{overflow-wrap:anywhere}.empty{text-align:center;color:#6c7b89;padding:22px}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}@media(max-width:650px){body{padding:12px}th,td{padding:7px 4px}.table-wrap table{min-width:620px}}
</style>
<main>
<h1>記事群F · 高密度コア</h1>
<div id="method" class="muted"></div>
<div id="cohort" class="muted"></div>
<div id="organization-policy" class="muted"></div>
<div id="stats" class="stats"></div>
<div id="definition" class="muted"></div>
<h2>クラスタとコア</h2>
<div class="card table-wrap">
<table><colgroup><col style="width:65px"><col style="width:58px"><col style="width:65px"><col style="width:92px"><col style="width:85px"><col></colgroup><thead><tr><th>クラスタ</th><th class="num">記事</th><th class="num">コア</th><th class="num">クラスタ平均<br>cos類似度</th><th class="num">コア平均<br>cos類似度</th><th>コア記事 · タイトルをクリックで全文</th></tr></thead><tbody id="cluster-summary"></tbody></table>
</div>
<h2>抽出記事</h2>
<div class="card">
<div class="controls"><select id="mode" aria-label="表示対象"><option value="core">コアのみ</option><option value="probability">帰属確率による候補</option><option value="centroid">重心による候補</option><option value="clustered">全クラスタ記事</option><option value="noise">ノイズ</option><option value="all">全記事</option></select><select id="cluster" aria-label="クラスタ"><option value="">全クラスタ</option></select><input id="search" type="search" placeholder="タイトル / 組織 / F ID を検索" aria-label="記事検索"><button id="reset">リセット</button></div>
<div class="table-wrap"><table><colgroup><col style="width:64px"><col style="width:56px"><col><col style="width:84px"><col style="width:95px"><col style="width:74px"></colgroup><thead><tr><th>クラスタ</th><th>記事ID</th><th>タイトル</th><th class="num">帰属確率</th><th class="num">重心との<br>cos類似度</th><th>選択</th></tr></thead><tbody id="articles"></tbody></table></div>
<div id="count" class="muted" style="margin-top:8px"></div>
<div class="links"><a href="cores.csv" download>コア CSV</a><a href="article-clusters.csv" download>全記事 CSV</a><a href="cores.json" download>コア JSON</a><a href="clusters.json" download>クラスタと元空間の重心</a></div>
</div>
<details><summary>条件を変えた場合の安定性</summary><p class="muted">主解析を固定し、シード・次元数・近傍数・最小クラスタサイズを一つずつ変更。ARIは全記事の分類の一致度（ノイズを含む）です。コア同士の再分類結果は各記事の詳細に表示します。</p><div class="card table-wrap"><table><colgroup><col><col style="width:75px"><col style="width:75px"><col style="width:75px"><col style="width:90px"></colgroup><thead><tr><th>変更条件</th><th class="num">クラスタ</th><th class="num">ノイズ</th><th class="num">コア</th><th class="num">主解析とARI</th></tr></thead><tbody id="variants"></tbody></table></div></details>
<p id="space-note" class="muted"></p>
</main>
<dialog id="detail"><h2 id="detail-title"></h2><div id="detail-info"></div><p><a id="detail-link" target="_blank" rel="noopener noreferrer">元記事を開く</a></p><button id="close-detail">閉じる</button></dialog>
<script type="application/json" id="data">__CORE_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),s=data.summary,p=s.parameters,byId=new Map(data.articles.map(a=>[a.f_id,a])),el=id=>document.getElementById(id),fmt=v=>v==null?'—':v.toFixed(4);
function cell(row,text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;row.append(td);return td}
function titleButton(a,includeId=false){const wrap=document.createElement('span'),button=document.createElement('button');wrap.className='title';button.textContent=(includeId?a.f_id+' · ':'')+a.title;button.title=a.title;button.onclick=()=>showArticle(a);wrap.append(button);return wrap}
function showArticle(a){el('detail-title').textContent=a.title;el('detail-info').replaceChildren();const infos=[`${a.f_id} · ${a.cluster_id||'ノイズ'} · 一致候補数 ${a.concept_count}`,`帰属確率 ${fmt(a.probability)}（クラスタ内順位 ${a.probability_rank||'—'}）`,`重心とのコサイン類似度 ${fmt(a.centroid_cosine)}（順位 ${a.centroid_rank||'—'}）`,a.is_core?'抽出コア':a.probability_core||a.centroid_core?'候補（両条件の共通部分には入らない）':'コア対象外'];if(a.organization_name)infos.push(`配信元組織: ${a.organization_name} (${a.organization_id})`,`公開日時: ${a.published_at}`);if(a.previous_f_id)infos.push(`前回126件の解析ID: ${a.previous_f_id}`);if(a.sensitivity_clustered_fraction!=null)infos.push(`条件変更${data.variants.length}回でノイズにならない割合 ${(100*a.sensitivity_clustered_fraction).toFixed(0)}%`);const c=data.clusters.find(c=>c.cluster_id===a.cluster_id);if(c)for(const pair of c.core_pairs.filter(q=>q.left_id===a.f_id||q.right_id===a.f_id))infos.push(`${pair.left_id===a.f_id?pair.right_id:pair.left_id}との類似度 ${fmt(pair.cosine)} · 条件変更後も同クラスタ ${pair.sensitivity_coassignment==null?'—':(100*pair.sensitivity_coassignment).toFixed(0)+'%'}`);for(const text of infos){const line=document.createElement('p');line.textContent=text;el('detail-info').append(line)}const link=el('detail-link');link.hidden=!/^https?:\/\//i.test(a.url||'');if(!link.hidden)link.href=a.url;el('detail').showModal()}
el('close-detail').onclick=()=>el('detail').close();
el('method').textContent=`L2正規化 → UMAP ${s.original_dimensions}→${s.reduced_dimensions}次元（cosine / 近傍${p.n_neighbors} / seed ${p.random_state}）→ HDBSCAN（最小${p.min_cluster_size}件 / min_samples ${p.min_samples} / ${p.cluster_selection_method}）`;
el('definition').textContent=`コア＝帰属確率${p.core_min_probability}以上の上位${p.core_top_n}件 ∩ 元のベクトルで重心に近い上位${p.core_top_n}件。帰属確率は所属の強さであり、内容の正解率ではありません。`;
if(s.cohort?.required_release_type)el('cohort').textContent=`対象: ${s.cohort.required_release_type} / ${s.cohort.allowed_domains.join('・')} / タイトル除外${s.cohort.title_exclusion_word_count}語 / 一致候補数5以上` ;
if(s.cohort?.organization_filter){const o=s.cohort.organization_filter;el('organization-policy').textContent=`配信元組織ごとに公開日時が最新の1記事 · ${o.source_article_count}→${o.selected_article_count}記事（${o.removed_article_count}記事を除外）`}
el('space-note').textContent=`重心・類似度はL2正規化済みの元${s.original_dimensions}次元空間で計算。UMAPの${s.reduced_dimensions}次元空間ではユークリッド距離でHDBSCANを実行。ノイズに分類された記事を強制的に割り当てません。`;
for(const [value,label] of [[s.article_count,'記事'],[s.cluster_count,'クラスタ'],[s.noise_count,'ノイズ'],[s.core_count,'コア記事']]){const box=document.createElement('div'),b=document.createElement('b');b.textContent=value;box.append(b,document.createTextNode(label));el('stats').append(box)}
for(const c of data.clusters){const row=document.createElement('tr');cell(row,c.cluster_id,'id');cell(row,c.article_count,'num');cell(row,c.core_count,'num');cell(row,fmt(c.mean_pair_cosine),'num');cell(row,fmt(c.core_mean_cosine),'num');const td=cell(row,'');if(c.core_ids.length)for(const id of c.core_ids)td.append(titleButton(byId.get(id),true));else td.textContent='共通条件を満たすコアなし';el('cluster-summary').append(row);const option=document.createElement('option');option.value=c.cluster_id;option.textContent=c.cluster_id;el('cluster').append(option)}
const variantNames={'seed-7':'乱数シード 7','seed-21':'乱数シード 21','dimensions-10':'UMAP 10次元','dimensions-20':'UMAP 20次元','neighbors-30':'UMAP 近傍30','minimum-size-8':'HDBSCAN 最小8件'};
for(const v of data.variants){const row=document.createElement('tr');cell(row,variantNames[v.name]||v.name);cell(row,v.cluster_count,'num');cell(row,v.noise_count,'num');cell(row,v.core_count,'num');cell(row,fmt(v.adjusted_rand_index_vs_main),'num');el('variants').append(row)}
function render(){const mode=el('mode').value,cluster=el('cluster').value,query=el('search').value.toLocaleLowerCase();const rows=data.articles.filter(a=>(mode==='all'||mode==='core'&&a.is_core||mode==='probability'&&a.probability_core||mode==='centroid'&&a.centroid_core||mode==='clustered'&&a.cluster_id||mode==='noise'&&!a.cluster_id)&&(!cluster||a.cluster_id===cluster)&&(!query||(a.title+' '+(a.organization_name||'')+' '+a.f_id).toLocaleLowerCase().includes(query))).sort((a,b)=>(a.cluster_id||'ZZZ').localeCompare(b.cluster_id||'ZZZ')||(b.centroid_cosine||0)-(a.centroid_cosine||0)||a.f_id.localeCompare(b.f_id));el('articles').replaceChildren();for(const a of rows){const row=document.createElement('tr');cell(row,a.cluster_id||'ノイズ',a.cluster_id?'id':'noise');cell(row,a.f_id,'id');cell(row,'','article').append(titleButton(a));cell(row,fmt(a.probability),'num');cell(row,fmt(a.centroid_cosine),'num');cell(row,a.is_core?'コア':a.probability_core&&a.centroid_core?'両候補':a.probability_core?'確率上位':a.centroid_core?'重心上位':'—',a.is_core?'core-label':'muted');el('articles').append(row)}if(!rows.length){const row=document.createElement('tr');const td=cell(row,'対象記事はありません','empty');td.colSpan=6;el('articles').append(row)}el('count').textContent=`${rows.length}件を表示 · 全${s.article_count}記事`}
el('mode').onchange=render;el('cluster').onchange=render;el('search').oninput=render;el('reset').onclick=()=>{el('mode').value='core';el('cluster').value='';el('search').value='';render()};render();
</script>
</html>
