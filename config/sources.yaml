  - key: "nikkei-topic-24032506"
    name: "日本経済新聞 トピック 24032506"
    type: "web"
    enabled: false
    list_url: "https://www.nikkei.com/topics/24032506"
    allowed_hosts: ["www.nikkei.com"]
    allow_url_patterns: ['^https://www\.nikkei\.com/article/[A-Z0-9]+/?$']
    deny_url_patterns: ['/login', '/auth/', '/registration', '/signup', '\.pdf$']
