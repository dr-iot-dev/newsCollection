# Separate deployment for kunsen.net; database and networks are isolated from airlabs.jp.
name: news-weave

x-app: &app
  build:
    context: .
    target: runtime
  environment: &app-environment
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-development-only}@db:5432/news
    SOURCES_CONFIG_PATH: /app/config/sources.yaml
    AI_PROVIDER: ${AI_PROVIDER:-disabled}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL_FACTS: ${AI_MODEL_FACTS:-}
    AI_SELECTOR_MODEL: ${AI_SELECTOR_MODEL:-}
    AI_WRITER_MODEL: ${AI_WRITER_MODEL:-}
    AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:-}
    AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-50000}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4000}
    AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-}
    AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-}
    AI_REQUIRE_DISTINCT_MODELS: ${AI_REQUIRE_DISTINCT_MODELS:-true}
    COMPARISON_SELECTION_MODE: ${COMPARISON_SELECTION_MODE:-legacy}
    AI_COMPARISON_PLANNER_MODEL: ${AI_COMPARISON_PLANNER_MODEL:-}
    AI_COMPARISON_ASSESSOR_MODEL: ${AI_COMPARISON_ASSESSOR_MODEL:-}
    AI_COMPARISON_VERIFIER_MODEL: ${AI_COMPARISON_VERIFIER_MODEL:-}
    AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
    AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-v1}
    COMPARISON_MIN_PRODUCTS: ${COMPARISON_MIN_PRODUCTS:-3}
    COMPARISON_MAX_EVALUATIONS: ${COMPARISON_MAX_EVALUATIONS:-8}
    COMPARISON_MIN_SOURCES: ${COMPARISON_MIN_SOURCES:-3}
    COMPARISON_AUTO_RESEARCH: ${COMPARISON_AUTO_RESEARCH:-true}
    FETCH_MISSING_SOURCES: ${FETCH_MISSING_SOURCES:-false}
    RESEARCH_MAX_CANDIDATES: ${RESEARCH_MAX_CANDIDATES:-100}
    RESEARCH_MAX_FACT_CHECKS: ${RESEARCH_MAX_FACT_CHECKS:-6}
    RESEARCH_MAX_SOURCES_PER_ATTEMPT: ${RESEARCH_MAX_SOURCES_PER_ATTEMPT:-6}
    RESEARCH_MAX_ATTEMPTS: ${RESEARCH_MAX_ATTEMPTS:-3}
    RESEARCH_RETRY_SECONDS: ${RESEARCH_RETRY_SECONDS:-60}
    REVIEW_REQUIRED: ${REVIEW_REQUIRED:-false}
    REVIEW_REQUIRE_FOUR_EYES: ${REVIEW_REQUIRE_FOUR_EYES:-true}
    DRAFT_EXPORT_ENABLED: ${DRAFT_EXPORT_ENABLED:-true}
    DRAFT_ARTIFACT_DIR: /data/drafts
    DRAFT_TRANSFER_DIR: ${DRAFT_TRANSFER_DIR:-}
    DRAFT_PRODUCER_ID: ${DRAFT_PRODUCER_ID:-}
    FEATURED_IMAGES_ENABLED: ${FEATURED_IMAGES_ENABLED:-true}
    AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-1.5}
    AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY:-medium}
    AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-1536x1024}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - draft-artifacts:/data/drafts
  networks: [backend]
  restart: unless-stopped

services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10

  scheduler:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    networks: [backend, collection]
    environment:
      <<: *app-environment
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]

  collect:
    <<: *app
    profiles: [tools]
    command: ["news-weave", "collect", "run"]
    networks: [backend, collection]
    environment:
      <<: *app-environment
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs: [/tmp]

  test:
    <<: *app
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      <<: *app-environment
      APP_ENV: test
      AI_PROVIDER: disabled
      AI_API_KEY: ""
      AI_MODEL_FACTS: ""
      AI_SELECTOR_MODEL: ""
      AI_WRITER_MODEL: ""
      AI_VERIFIER_MODEL: ""
      FEATURED_IMAGES_ENABLED: "false"
      TEST_DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-development-only}@db:5432/news
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "ruff check --no-cache . && mypy --cache-dir /tmp/mypy-cache app && pytest -p no:cacheprovider"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]

volumes:
  draft-artifacts:
  postgres-data:

networks:
  backend:
    internal: true
  frontend:
    driver: bridge
  collection:
    driver: bridge
