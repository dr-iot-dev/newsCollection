# New project and volume; the old running deployment is not changed by this file.
name: news-weave-v2
services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: newsweave_pipeline
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pipeline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsweave_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      target: runtime
    environment:
      PIPELINE_DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD}@db:5432/newsweave_pipeline
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pipeline-output:/data
    command: ["news-weave", "--help"]
    read_only: true
    tmpfs: [/tmp]
  test:
    profiles: [test]
    build:
      context: .
      target: test
    read_only: true
    tmpfs: [/tmp]
volumes:
  pipeline-postgres:
  pipeline-output:
