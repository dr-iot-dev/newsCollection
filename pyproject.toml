[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "news-weave"
version = "0.6.0"
description = "Seven-stage AI/IoT comparison article pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4==4.14.3",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "umap-learn==0.5.12",
  "hdbscan==0.8.44",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]

[project.scripts]
news-weave = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]
