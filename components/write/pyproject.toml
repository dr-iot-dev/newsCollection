[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "news-weave-write"
version = "1.0.0"
requires-python = ">=3.13,<3.15"
dependencies = ["pydantic==2.13.5", "httpx==0.28.1", "beautifulsoup4==4.14.3", "soupsieve==2.10", "markdown-it-py==4.0.0", "Pillow==12.3.0", "PyYAML==6.0.2", "defusedxml==0.7.1", "structlog==25.4.0"]

[project.scripts]
nw-write = "nw_write.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nw_write"]
